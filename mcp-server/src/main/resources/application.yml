spring:
  application:
    name: mcp-server
  main:
    banner-mode: off
    web-application-type: none
  ai:
    mcp:
      server:
        name: time-server
        version: 1.0.0
        type: sync
        stdio: true
logging:
  threshold:
    console: OFF
  file:
    name: ./mcp.logs
---
spring:
  config:
    activate:
      on-profile: http
  main:
    banner-mode: console
    web-application-type: servlet
  ai:
    mcp:
      server:
        stdio: false
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
server:
  port: 8090
logging:
  threshold:
    console: TRACE