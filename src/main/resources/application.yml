spring:
  ai:
    openai:
      base-url: https://ai.klasawchmurze.pl
      api-key: ${LLM_API_KEY}
      chat:
        model: qwen3.8-27b
        reasoning-effort: none
        max-tokens: 4096
        temperature: 0.2
      embedding:
        model: embed-bge-m3

#      api-key: ${OPENAI_KEY}
#      chat:
#        model: gpt-4.1
#        max-tokens: 4096
#        temperature: 0.1
    ollama:
      chat:
        model: qwen3.5:0.8b
      embedding:
        model: bge-m3
      init:
        pull-model-strategy: when_missing
        max-retries: 3
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json
        streamable-http:
          connections:
#            mcp-server:
#              url: http://localhost:8090
#              endpoint: /mcp
            mcp-search:
              url: https://mcp-search.klasawchmurze.pl
              endpoint: /mcp
    vectorstore:
      pgvector:
        initialize-schema: true
        #index-type: hnsw
        #distance-type: cosine_distance
        # dimensions: ${LLM_EMBED_DIM:768}
          # nomic-embed-text  -> 768
          # bge-m3            -> 1024
          # text-embedding-3-small (OpenAI) -> 1536
  datasource:
    url: jdbc:postgresql://localhost:5432/training
    username: admin
    password: admin
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    io.modelcontextprotocol: DEBUG